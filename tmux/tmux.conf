set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=blue bold"
set -g status-right ""
bind r source-file "/Users/fukushimahideto/.config/tmux/tmux.conf"
bind b set -g status
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi V send-keys -X select-line
bind p split-window -h
bind i split-window -v
bind h previous-window
bind l next-window
bind-key -n M-Left resize-pane -L 1
bind-key -n M-Right resize-pane -R 1
bind-key -n M-Up resize-pane -U 1
bind-key -n M-Down resize-pane -D 1
bind w kill-pane
bind n new-window
bind-key -r f run-shell "tmux neww ~/dotfiles/tmux-sessionizer/tmux-sessionizer"
bind-key -r s send-keys "source ~/.zshrc\n"
bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -r M-s run-shell "tmux neww tmux-sessionizer -s 3"
# 非アクティブなペインの背景色 (デフォルトのターミナル背景)
set-window-option -g window-style "bg=#CCCCCC"

# アクティブなペインの背景色を少し明るいグレーにする
set-window-option -g window-active-style "bg=#FFFFFF"
