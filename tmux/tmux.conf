
# --- Leader key ---
unbind C-b
set-option -g prefix C-Space
bind C-Space send-prefix

# --- Window / Pane 操作 ---
bind h previous-window
bind l next-window
bind k kill-pane
bind n new-window

# --- カスタム起動 ---
bind-key -r g run-shell "tmux neww ~/dotfiles/tmux-sessionizer/tmux-sessionizer"

# --- zsh default ---
set -g default-shell /bin/zsh
set -g default-command "exec /bin/zsh -l"



# OSC52 clipboard integration
set -s set-clipboard on

# vi-style copy mode
setw -g mode-keys vi

# tmux copy-mode で y / Enter したら tmux buffer にコピー
# set-clipboard on により OSC52 経由で外側の clipboard にも送られる
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# tmux 3.2+ 向け: OSC52 clipboard capability を明示
set -as terminal-features ',xterm-256color:clipboard'
set -as terminal-features ',tmux-256color:clipboard'
set -as terminal-features ',screen-256color:clipboard'
